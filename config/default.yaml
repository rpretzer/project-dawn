# Project Dawn - Default Configuration

node:
  identity_path: ~/.project-dawn/vault/node_identity.key
  address: ws://0.0.0.0:8000
  data_root: ~/.project-dawn

network:
  # Comma-separated or list of ws://host:port addresses for initial DHT seeding.
  # Leave empty for single-node / local-only setups.
  bootstrap_nodes: []
  # Enable Kademlia DHT peer discovery (recommended for networks with > ~10 nodes).
  enable_dht: false

security:
  trust_level_default: UNKNOWN  # UNKNOWN, VERIFIED, TRUSTED, BOOTSTRAP
  reject_unknown: false
  audit_log_path: ~/.project-dawn/vault/audit.log

resilience:
  rate_limit:
    max_requests: 100
    time_window: 60.0
  circuit_breaker:
    failure_threshold: 5
    timeout: 60.0

logging:
  level: INFO  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: text  # text or json
  file: ~/.project-dawn/logs/dawn.log

observability:
  metrics_port: 9090
  enable_tracing: false

compute:
  # Logits provider to use for Proof-of-Logits generation.
  # "synthetic" — deterministic fake logits; no GPU required (default for development).
  # "torch"     — real model inference via PyTorch; requires model_path and a compatible GPU.
  logits_provider: synthetic

  # Path to a HuggingFace-compatible model directory (required when logits_provider = torch).
  model_path: ""

  # Proof-of-Logits sampling parameters.
  seed: 0
  sample_rate: 0.1
  top_k: 5
